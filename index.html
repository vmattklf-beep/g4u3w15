{q:'Which type of data is “favorite color”?',opts:['Continuous','Categorical','Discrete','Measured'],correct:1,why:'Color names are categories or groups.'},

{q:'Which example is continuous data?',opts:['Favorite fruit','Type of transport','Number of pets','Temperature'],correct:3,why:'Temperature is measured and can include decimals.'},
{q:'Which chart best compares votes for different fruits?',opts:['Column chart','Line chart','Map','Clock'],correct:0,why:'A column chart makes category totals easy to compare.'},
{q:'Which chart shows daily temperature changes clearly?',opts:['Bar chart','Line chart','Table of colors','Pie chart'],correct:1,why:'A line chart is useful for values changing over time.'},
{q:'Which title best describes a chart about color votes?',opts:['School Lunch','Temperature This Week','Our Favorite Colors','My Timetable'],correct:2,why:'A chart title tells the reader what the data shows.'},
{q:'Which is an evenly spaced graph scale starting at zero?',opts:['0, 2, 5, 6, 9','0, 2, 4, 6, 8','4, 5, 7, 9, 10','0, 1, 3, 7, 9'],correct:1,why:'The numbers increase by the same amount: 2.'},

{q:'Red has 5 votes and Blue has 8. What happens if Red changes to 10?',opts:['Blue is still first','Red becomes the highest','The votes stay the same','The colors disappear'],correct:1,why:'10 votes is more than 8, so Red becomes the most popular.'},
{q:'If one vote count changes from 5 to 10, what else can change?',opts:['Only the chart title','The keyboard','The total and chart height','The names of all colors'],correct:2,why:'A changed data item can change totals, charts and conclusions.'}

{id:'types',title:'Learn: Three Types of Data',label:'Data types',eyebrow:'03 · Discover',time:'3 minutes',desc:'Sort information into the correct data groups.',required:true},
{id:'chartchoice',title:'Learn: Choose the Best Chart',label:'Choose a chart',eyebrow:'04 · Discover',time:'3 minutes',desc:'Find out when to use columns and when to use a line.',required:true},
{id:'scales',title:'Learn: Make Graphs Fair',label:'Graph scales',eyebrow:'05 · Try it',time:'3 minutes',desc:'Experiment with different scales and check your understanding.',required:true},
{id:'lab',title:'Practice: Change the Data',label:'Data experiment',eyebrow:'06 · Experiment',time:'4 minutes',desc:'Change a number. Watch the chart and results change.',required:true},
{id:'design',title:'Practice: Become a Chart Designer',label:'Chart designer',eyebrow:'07 · Create',time:'3 minutes',desc:'Pick a chart type, title and scale to tell the truth clearly.',required:true},
{id:'insight',title:'Practice: Explain What Changed',label:'Explain results',eyebrow:'08 · Explain',time:'2 minutes',desc:'Write a short conclusion using your own data experiment.',required:true},
{id:'quiz',title:'Chart Explorer Quiz',label:'Review quiz',eyebrow:'09 · Check learning',time:'5 minutes',desc:'Answer 10 questions, one at a time.',required:true},
{id:'reflection',title:'Reflection & Exit Ticket',label:'Reflection',eyebrow:'10 · Reflect',time:'2 minutes',desc:'Tell us what you learned today.',required:true},

 const lines=5;
 if(type==='bar'){
  a+=`<line x1="${left+70}" y1="${top}" x2="${left+70}" y2="${top+PH}" stroke="#a8bcd0"/>`;
  for(let k=0;k<=lines;k++){let v=max*k/lines,x=left+70+(PW-75)*k/lines;a+=`<line x1="${x}" y1="${top}" x2="${x}" y2="${top+PH}" stroke="${grid}"/><text x="${x}" y="${top+PH+20}" text-anchor="middle" fill="${ink}" font-size="12">${Number(v.toFixed(1))}</text>`}
  let rowH=PH/labels.length;
  labels.forEach((n,i)=>{let y=top+i*rowH+rowH*.18,h=rowH*.63,w=Math.min(values[i],max)/max*(PW-75);a+=`<text x="${left+60}" y="${y+h/2+4}" text-anchor="end" fill="${ink}" font-size="13">${esc(n)}</text><rect x="${left+70}" y="${y}" width="${Math.max(0,w)}" height="${h}" rx="6" fill="${colors[i]||'#4b7ff4'}"/><text x="${left+76+Math.max(0,w)}" y="${y+h/2+4}" fill="${ink}" font-size="12" font-weight="700">${values[i]}</text>`});
 }else{
  for(let k=0;k<=lines;k++){let v=max*k/lines,y=top+PH-PH*k/lines;a+=`<line x1="${left}" y1="${y}" x2="${W-right}" y2="${y}" stroke="${grid}"/><text x="${left-10}" y="${y+4}" text-anchor="end" fill="${ink}" font-size="12">${Number(v.toFixed(1))}</text>`}
  a+=`<line x1="${left}" y1="${top}" x2="${left}" y2="${top+PH}" stroke="#a7bdcf"/>`;
  let barW=Math.min(70,PW/labels.length*.59),centers=labels.map((_,i)=>left+PW*(i+.5)/labels.length);
  if(type==='line'){
   const path=labels.map((n,i)=>(i?'L':'M')+centers[i]+','+(top+PH-Math.min(values[i],max)/max*PH)).join(' ');a+=`<path d="${path}" stroke="#3676e8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
   labels.forEach((n,i)=>{let y=top+PH-Math.min(values[i],max)/max*PH;a+=`<circle cx="${centers[i]}" cy="${y}" r="6" fill="#fff" stroke="#3676e8" stroke-width="3"/><text x="${centers[i]}" y="${Math.max(top+11,y-13)}" text-anchor="middle" fill="${ink}" font-weight="800" font-size="13">${values[i]}</text>`});
  }else labels.forEach((n,i)=>{let bh=PH*Math.min(values[i],max)/max,y=top+PH-bh;a+=`<rect x="${centers[i]-barW/2}" y="${y}" width="${barW}" height="${bh}" rx="5" fill="${colors[i]||'#4b7ff4'}"/><text x="${centers[i]}" y="${Math.max(top+12,y-9)}" text-anchor="middle" fill="${ink}" font-weight="800" font-size="13">${values[i]}</text>`});
  labels.forEach((n,i)=>a+=`<text x="${centers[i]}" y="${top+PH+21}" text-anchor="middle" fill="${ink}" font-size="13">${esc(n)}</text>`);
 }
 a+=`</svg>`;return a;
}
function colorChart(type='column',scale=10,vals=votes()){return `<div class="chart-shell"><div class="chart-title">Our Favorite Colors</div>${chartSvg(['Blue','Red','Green','Yellow'],vals,type,scale,Object.values(COLORS))}<div class="answer-caption" style="text-align:center">${type==='line'?'This line connects categories. Does it make sense?':type==='bar'?'Horizontal axis: Votes · Vertical axis: Color':'Horizontal axis: Color · Vertical axis: Number of Votes'}</div></div>`}
function buttonSet(key,options,selected){return `<div class="choice-group">${options.map(o=>`<label class="option"><input type="radio" name="${esc(key)}" data-bind="${esc(key)}" value="${esc(o[0])}" ${selected===o[0]?'checked':''}><span>${esc(o[1])}</span></label>`).join('')}</div>`}
function register(){let st=state.student;$('#topProgress').style.width='0%';$('#studentBadge').textContent='30-minute lesson';$('#editProfileTop').classList.add('hidden');$('#app').innerHTML=`<div class="register"><div class="reg-top"><div class="eyebrow">● YOUR DATA ADVENTURE STARTS HERE</div><h1>Welcome to Your<br>Interactive Lesson!</h1><p>Learn to choose charts, change data, and discover what the numbers tell us.</p><div class="pills"><span class="pill">📊 Grade 4 ICT</span><span class="pill">⏱ 30 minutes</span></div></div><div class="reg-bottom"><h2 style="margin:0 0 4px">👋 Hello, Chart Explorer!</h2><p class="muted" style="margin:0 0 23px;font-size:14px">Please enter your information before starting.</p><form id="regForm" novalidate><div class="reg-grid"><div><label for="studentName" class="input-label">Student Name *</label><input class="field" id="studentName" name="studentName" autocomplete="off" maxlength="90" placeholder="Type your full name" value="${esc(st.name)}" required></div><div><label for="studentClass" class="input-label">Class *</label><select class="field" id="studentClass" name="studentClass" required><option value="">Choose your class</option>${['4B1','4B2','4B3','4B4'].map(c=>`<option value="${c}" ${st.className===c?'selected':''}>${c}</option>`).join('')}</select></div></div><div id="regError" class="validation hidden" role="alert"></div><div class="reg-note"><span aria-hidden="true">🔒</span><span><b>Your work stays private.</b> Your name and answers remain in this browser. Nothing is sent to a server. Save your Excel file before closing or refreshing this page.</span></div><button class="btn btn-primary btn-full btn-lg" type="submit">${state.editing?'Save Information & Return →':'Start Lesson →'}</button></form><div class="privacy-foot">No account · No password · Works on GitHub Pages</div></div></div>`;
 $('#regForm').addEventListener('submit',e=>{e.preventDefault();const name=$('#studentName').value.replace(/\s+/g,' ').trim(),cls=$('#studentClass').value;let msg='';if(name.length<2)msg='Please enter your name (at least 2 letters).';else if(!['4B1','4B2','4B3','4B4'].includes(cls))msg='Please choose your class.';if(msg){$('#regError').textContent=msg;$('#regError').classList.remove('hidden');return;}state.student={name,className:cls};state.registered=true;state.current=state.editing?state.returnIndex:0;state.editing=false;render()});
}
function footer(t){let prev=state.current>0?`<button type="button" class="btn btn-ghost" data-action="prev">← Previous</button>`:`<span></span>`;let next=t.id==='results'?'':t.id==='quiz'&&!state.answers.quizSubmitted?'':`<button type="button" class="btn btn-primary end" data-action="next">${t.id==='challenge'?'View Results →':t.id==='homework'?'Continue →':t.id==='quiz'?'Continue to Reflection →':'Complete Task & Next →'}</button>`;return `<div class="task-footer">${prev}${next}</div>`}
function render(){if(!state.registered||state.current<0){register();return;}let t=TASKS[state.current],pct=Math.round(completedCount()/REQUIRED*100);$('#topProgress').style.width=pct+'%';$('#studentBadge').textContent=`${state.student.className} · ${state.student.name.split(' ')[0]}`;$('#editProfileTop').classList.remove('hidden');let side=TASKS.map((s,i)=>{const done=!!state.completed[s.id],open=i<=state.furthest&&!(s.id==='results'&&!allReady());return `<button class="side-item ${i===state.current?'active':''} ${done?'done':''}" data-action="jump" data-index="${i}" ${open?'':'disabled'} ${i===state.current?'aria-current="step"':''}><span class="side-index">${done?'✓':i+1}</span><span>${esc(s.label)}${s.id==='challenge'?'<small>OPTIONAL</small>':''}</span></button>`}).join('');
 let page=PAGE[t.id]();$('#app').innerHTML=`<div class="workarea"><aside class="sidebar"><div class="sidehead"><div class="eyebrow">YOUR JOURNEY</div><h2>${completedCount()} of ${REQUIRED} required tasks done</h2></div>${side}</aside><section class="task-area"><div class="task-top"><span class="task-progress">Task <b>${state.current+1} of ${TASKS.length}</b> · ${esc(t.label)}</span><span class="step-percent">${pct}% complete</span></div><article class="task-card"><header class="task-hero"><div class="eyebrow">${esc(t.eyebrow)}</div><h1 id="taskTitle" tabindex="-1">${esc(t.title)}</h1><p>${esc(t.desc)}</p><span class="duration">◷ ${esc(t.time)}</span></header><div class="task-body">${page}<div id="actionFeedback" role="status" aria-live="polite"></div></div>${footer(t)}</article><div class="privacy-foot">🔒 Your answers stay on this device until you download your Excel file. Refreshing or closing this tab may erase your work.</div></section></div>`;
 window.scrollTo({top:0,behavior:'instant'});

function feedback(s,bad=false){let e=$('#actionFeedback');if(e)e.innerHTML=`<div class="feedback ${bad?'bad':''}">${esc(s)}</div>`;announce(s)}
function validate(id){const a=state.answers;switch(id){case 'goals':return true;case 'warmup':return a.warmup.trim().length>=6;case 'types':return DATA_TYPES.every((x,i)=>a.types[i]!==undefined)&&!!state.checked.types;case 'chartchoice':return CHART_CHOICE.every((x,i)=>a.chartchoice[i]!==undefined)&&!!state.checked.chartchoice;case 'scales':return !!a.scale&&!!state.checked.scales;case 'lab':return Object.keys(BASE).some(k=>a.labVotes[k]!==BASE[k])&&a.labChecked&&Array.from(document.querySelectorAll('[data-vote]')).every(el=>el.validity.valid);case 'design':return !!a.design.type&&!!a.design.title&&!!a.design.scale&&a.designChecked;case 'insight':return a.insight.trim().length>=12;case 'quiz':return a.quizSubmitted;case 'reflection':return a.reflection.trim().length>=12;case 'homework':return a.homeworkAware;default:return true;}}
const ERR={warmup:'Write a short prediction before continuing.',types:'Choose all three answers and click “Check My Answers”.',chartchoice:'Choose both chart types and click “Check My Answers”.',scales:'Choose a scale and click “Check My Answer”.',lab:'Change at least one vote count, then click “Check My Experiment”.',design:'Choose a chart type, title and scale, then click “Check My Chart”.',insight:'Write at least one clear sentence about what changed.',quiz:'Answer all 10 questions and submit the quiz first.',reflection:'Write one sentence about your learning.',homework:'Tick the box to show you have read the homework instructions.'};
function next(){let t=TASKS[state.current];if(!validate(t.id)){feedback(ERR[t.id]||'Please finish this task.',true);return;}if(t.required)state.completed[t.id]=true;if(state.current>=TASKS.length-1)return;state.current++;state.furthest=Math.max(state.furthest,state.current);if(TASKS[state.current].id==='results'&&!allReady()){state.current=TASKS.findIndex(x=>x.required&&!state.completed[x.id]);feedback('Please complete the remaining required task.',true)}render();}
function prev(){if(state.current>0){state.current--;render()}}

function goalsPage(){return `<div class="result-hero" style="margin:0 0 21px"><div class="eyebrow" style="color:#80e8db">📈 TODAY’S MISSION</div><h2>Turn Data Into a Story</h2><p>Graphs can help you compare results, find patterns, and spot changes.</p></div><h2>🎯 Today I am learning to...</h2><div class="cards3"><div class="concept"><div class="symbol">🔎</div><strong>5MD.02 · Identify</strong><p>Recognise categorical, discrete and continuous data and choose a good chart.</p></div><div class="concept"><div class="symbol">📊</div><strong>5MD.03 · Modify</strong><p>Change chart types, labels and scales to make data clearer.</p></div><div class="concept"><div class="symbol">🔄</div><strong>5MD.07 · Investigate</strong><p>See how changing one number can affect results and conclusions.</p></div></div><div class="soft mint"><strong>✅ I can...</strong><p>✔ Choose a suitable chart.<br>✔ Make the scale and labels easy to read.<br>✔ Explain what changes when I edit data.</p></div><p class="muted">Click <b>Complete Task & Next</b> when you are ready.</p>`}
function warmupPage(){return `<h2>🤔 Look at these votes</h2><div class="two-col"><div><table class="data-table"><thead><tr><th>Favorite Color</th><th>Votes</th></tr></thead><tbody>${Object.entries(BASE).map(([k,v])=>`<tr><td><span class="dot" style="--d:${COLORS[k]}"></span> ${k}</td><td>${v}</td></tr>`).join('')}</tbody></table><div class="hint-box">Think: Which color is the most popular? How could a picture help?</div></div>${colorChart()}</div><label class="input-label" for="warmupResponse" style="margin-top:20px">✍️ Your prediction</label><textarea id="warmupResponse" class="field" data-bind="warmup" placeholder="I think ... because ..." maxlength="350">${esc(state.answers.warmup)}</textarea><div class="choice-desc">Write a short idea. There is no automatic score for this answer; your teacher can review it.</div>`}
function typesPage(){let a=state.answers;return `<div class="cards3"><div class="concept"><div class="symbol">🏷️</div><strong>Categorical</strong><p>Names or groups. Ask: <b>What group?</b></p><span class="example">Example: favorite fruit</span></div><div class="concept"><div class="symbol">🔢</div><strong>Discrete</strong><p>Counted whole numbers. Ask: <b>How many?</b></p><span class="example">Example: number of pets</span></div><div class="concept"><div class="symbol">🌡️</div><strong>Continuous</strong><p>Measurements. Ask: <b>How much?</b></p><span class="example">Example: temperature</span></div></div><h2>🎯 Your task: Identify the data type</h2><p class="muted">Choose the correct type for all three examples.</p>${DATA_TYPES.map((x,i)=>`<div class="question-box"><div class="tag">EXAMPLE ${i+1} OF 3</div><p>${esc(x.prompt)}</p><select class="field" data-bind="type-${i}" aria-label="Data type for ${esc(x.prompt)}"><option value="">Choose a data type</option>${[['categorical','Categorical'],['discrete','Discrete'],['continuous','Continuous']].map(op=>`<option value="${op[0]}" ${a.types[i]===op[0]?'selected':''}>${op[1]}</option>`).join('')}</select></div>`).join('')}<button class="btn btn-teal" type="button" data-action="check-types">✓ Check My Answers</button>${state.checked.types?`<div class="feedback">You got ${scoreTypes()} of 3 correct. ${DATA_TYPES.map((x,i)=>x.prompt+': '+x.correct+'. '+x.why).join(' ')}</div>`:''}`}
function chartChoicePage(){const a=state.answers;return `<h2>📊 Which chart fits the data?</h2><div class="soft"><b>Column / bar chart</b> → compare groups or counted totals.<br><b>Line chart</b> → show measurements changing over time.</div><div class="two-col"><div>${colorChart('column',10,[8,5,4,3])}<p class="choice-desc">Favorite colors are categories. Compare the columns.</p></div><div><div class="chart-shell"><div class="chart-title">Temperature Over Five Days (°C)</div>${chartSvg(['Mon','Tue','Wed','Thu','Fri'],[20,22,25,23,27],'line',30,['#3d81ea'])}<div class="answer-caption">The line shows temperature changes across the days.</div></div></div></div><h2>🎯 Your task: Choose the best chart</h2>${CHART_CHOICE.map((c,i)=>`<div class="question-box"><div class="tag">DATASET ${i+1} OF 2</div><p>${esc(c.prompt)}</p>${buttonSet('chart-'+i,[['column','Column / bar chart'],['line','Line chart']],a.chartchoice[i])}</div>`).join('')}<button class="btn btn-teal" type="button" data-action="check-chartchoice">✓ Check My Answers</button>${state.checked.chartchoice?`<div class="feedback">You got ${scoreChartChoice()} of 2 correct. ${CHART_CHOICE.map(x=>x.why).join(' ')}</div>`:''}`}
function scalesPage(){const max=state.answers.scaleMax;return `<h2>📏 What is a graph scale?</h2><p>The <b>scale</b> is the set of numbers along a chart axis. Use even steps and make sure every value fits.</p><div class="soft mint"><b>Try it!</b> Change the maximum number below. The votes stay the same, but the picture changes.</div><div class="control-row"><button type="button" class="btn ${max===10?'btn-dark':'btn-soft'}" data-action="scale-10">Scale: 0–10</button><button type="button" class="btn ${max===20?'btn-dark':'btn-soft'}" data-action="scale-20">Scale: 0–20</button></div><div id="scaleChart">${colorChart('column',max,[8,5,4,3])}</div><p class="hint-box" id="scaleExplain">${max===10?'The highest vote is 8. A scale ending at 10 shows the differences clearly.':'The same votes look shorter with a maximum of 20. The numbers did not change!'}</p><h2>🎯 Quick check</h2><p>Which scale starts at zero and increases in equal steps?</p>${buttonSet('scale',[['uneven','0, 1, 4, 7, 10'],['even','0, 2, 4, 6, 8, 10'],['truncated','5, 6, 7, 8, 9, 10 (does not start at zero)']],state.answers.scale)}<button class="btn btn-teal" data-action="check-scales" type="button">✓ Check My Answer</button>${state.checked.scales?`<div class="feedback">${scoreScale()?'Correct!':'Good try!'} The suitable scale is 0, 2, 4, 6, 8, 10. For a simple column chart, starting at zero makes comparisons fair.</div>`:''}`}
function labPage(){let a=state.answers,changed=Object.keys(BASE).some(k=>a.labVotes[k]!==BASE[k]);return `<h2>🧪 Change One Number</h2><p>You have class color-vote data. Edit <b>at least one vote</b>. The graph, total and most popular color will update immediately.</p><div class="two-col"><div><div class="soft" style="margin-top:0"><div class="mini-label">LIVE DATA TABLE</div>${Object.keys(BASE).map(k=>`<label class="vote-row"><span class="vote-tag"><span class="dot" style="--d:${COLORS[k]}"></span>${k}<small class="muted">(was ${BASE[k]})</small></span><input class="vote-input" type="number" min="0" max="20" step="1" inputmode="numeric" data-vote="${k}" value="${a.labVotes[k]}" aria-label="${k} votes, originally ${BASE[k]}"></label>`).join('')}<p class="choice-desc">Use whole numbers from 0 to 20. Example: change Red from 5 to 10.</p><button type="button" class="btn btn-soft" data-action="reset-votes">↺ Reset votes</button></div><div id="labSummary">${labSummary()}</div></div><div id="labChart">${colorChart('column',Math.max(10,Math.ceil(maxData()/5)*5))}</div></div><div class="hint-box">Question: How can one changed number affect which color is most popular?</div><button type="button" class="btn btn-teal" data-action="check-lab">✓ Check My Experiment</button>${a.labChecked&&changed?`<div class="feedback">Great experiment! You changed the data. Compare the new totals and most popular color with the original result.</div>`:''}`}
function labSummary(){return `<div class="stats-grid"><div class="stat"><small>SUM = Total votes</small><strong>${total()}</strong></div><div class="stat"><small>AVERAGE</small><strong>${(total()/4).toFixed(1)}</strong></div><div class="stat"><small>Most votes</small><strong style="font-size:14px;margin-top:6px">${esc(winner(state.answers.labVotes))}</strong></div></div><p class="choice-desc">Original result: <b>20</b> votes, Blue most popular. New result changes when you edit the numbers.</p>`}
function designPage(){let d=state.answers.design,scale=d.scale?Number(d.scale):Math.max(10,Math.ceil(maxData()/5)*5),type=d.type||'column',label=d.title==='colors'?'Our Favorite Colors':d.title==='temp'?'Temperature Over Five Days':d.title==='sports'?'Favorite Sports':'Choose a Chart Title';return `<h2>🎨 Make a clear, honest chart</h2><p>Use the votes from your experiment. Pick the most suitable chart type, title, and scale.</p><div class="two-col"><div><label class="input-label" for="chartType">1. Choose a chart type</label><select class="field" id="chartType" data-bind="design-type"><option value="">Select chart type</option><option value="column" ${d.type==='column'?'selected':''}>Column chart</option><option value="bar" ${d.type==='bar'?'selected':''}>Bar chart</option><option value="line" ${d.type==='line'?'selected':''}>Line chart</option></select><label class="input-label" for="chartTitle" style="margin-top:16px">2. Choose a title</label><select class="field" id="chartTitle" data-bind="design-title"><option value="">Select chart title</option><option value="colors" ${d.title==='colors'?'selected':''}>Our Favorite Colors</option><option value="temp" ${d.title==='temp'?'selected':''}>Temperature Over Five Days</option><option value="sports" ${d.title==='sports'?'selected':''}>Favorite Sports</option></select><label class="input-label" for="chartScale" style="margin-top:16px">3. Choose the maximum scale</label><select class="field" id="chartScale" data-bind="design-scale"><option value="">Select scale</option>${[10,20,25].map(n=>`<option value="${n}" ${d.scale===String(n)?'selected':''}>0 to ${n}</option>`).join('')}</select><p class="choice-desc">Highest vote in your data: <b>${maxData()}</b>. The scale must show this number.</p></div><div id="designerChart"><div class="chart-shell"><div class="chart-title">${esc(label)}</div>${chartSvg(['Blue','Red','Green','Yellow'],votes(),type,scale,Object.values(COLORS))}<div class="answer-caption">${maxData()>scale?'⚠ Some values exceed the scale and are cut off.':'All values are visible on this scale.'}</div></div></div></div><button type="button" class="btn btn-teal" data-action="check-design" style="margin-top:18px">✓ Check My Chart</button>${state.answers.designChecked?`<div class="feedback">Chart design: ${scoreDesign()} of 3 correct. ${['column','bar'].includes(d.type)?'Good chart type.':'A bar or column chart compares categories.'} ${d.title==='colors'?'Good title.':'Use a title that matches favorite color votes.'} ${Number(d.scale)>=maxData()?'Your scale shows every value.':'Choose a maximum that includes the highest vote.'}</div>`:''}`}
function insightPage(){let before=winner(BASE),after=winner(state.answers.labVotes);return `<h2>🔍 Be a Data Detective</h2><div class="soft"><div class="mini-label">YOUR EXPERIMENT</div><table class="data-table"><thead><tr><th>Color</th><th>Before</th><th>After</th></tr></thead><tbody>${Object.keys(BASE).map(k=>`<tr><td>${k}</td><td>${BASE[k]}</td><td>${state.answers.labVotes[k]}</td></tr>`).join('')}</tbody></table><p><b>Before:</b> ${before} was most popular. <b>Now:</b> ${after} ${after.includes(' and ')?'are tied for the most votes.':'has the most votes.'}</p></div><label for="insightResponse" class="input-label">✍️ Explain how changing a data item affected the results.</label><textarea class="field" id="insightResponse" data-bind="insight" maxlength="600" placeholder="I changed ... from ... to ... . This made the chart ... because ...">${esc(state.answers.insight)}</textarea><div class="hint-box">Sentence starter: “When I changed ___ votes from ___ to ___, the chart showed ___.”</div><p class="choice-desc">Your explanation will be saved for teacher review. It is not automatically marked.</p>`}

 let cen=new Uint8Array(46+nm.length),cv=new DataView(cen.buffer);u32(cv,0,0x02014b50);u16(cv,4,20);u16(cv,6,20);u16(cv,8,0);u16(cv,10,0);u32(cv,16,crc);u32(cv,20,data.length);u32(cv,24,data.length);u16(cv,28,nm.length);u32(cv,42,offset);cen.set(nm,46);central.push(cen);offset+=loc.length+data.length;}
 let cdSize=central.reduce((n,b)=>n+b.length,0),end=new Uint8Array(22),ev=new DataView(end.buffer);u32(ev,0,0x06054b50);u16(ev,8,central.length);u16(ev,10,central.length);u32(ev,12,cdSize);u32(ev,16,offset);return new Blob([...parts,...central,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});}

function downloadWorkbook(){const name=state.student.name.normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9 -]/g,'').trim().replace(/\s+/g,'_').slice(0,55)||'Student';const filename=`G4_${state.student.className}_${name}_Week15_Results.xlsx`;try{let blob=makeXlsx();const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);feedback(`Downloaded ${filename}. Now open VinSchool LMS and upload this Excel file.`);}catch(err){console.error(err);feedback('The Excel file could not be generated. Please try again, or ask your teacher for help.',true);}}
